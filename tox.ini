[tox]
requires =
    tox>=4.26
    tox-uv
envlist =
    py{312,313}-dj52-wt70
    py{312,314}-dj52-wt74
    py{312,314}-dj60-wt74
    py{312,314}-dj52-wt80
    py{312,314}-dj{60,61}-wt80
    py312-lowest
    format

[testenv]
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    wt70: wagtail>=7.0,<7.1
    wt74: wagtail>=7.4,<7.5
    wt80: wagtail>=8.0,<8.1
commands =
    python -W error::RuntimeWarning manage.py test {posargs}
setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONPATH={toxinidir}

[testenv:py312-lowest]
description = run the tests against the lowest versions allowed by pyproject.toml
deps =
uv_resolution = lowest-direct

[testenv:wagtailmain]
basepython = python3.13
deps =
    Django>=6.0
    wagtail @ git+https://github.com/wagtail/wagtail.git@main

[testenv:format]
deps =
    ruff
skip_install = true
commands =
    ruff format --check wagtailstreamforms/ tests/
    ruff check wagtailstreamforms/ tests/
