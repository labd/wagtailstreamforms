name: Python Tests

on: [push]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Validate formatting
        run: uvx --with tox-uv tox -e format

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            tox_env: py312-dj52-wt70
          - python-version: "3.13"
            tox_env: py313-dj52-wt70
          - python-version: "3.12"
            tox_env: py312-dj52-wt74
          - python-version: "3.14"
            tox_env: py314-dj52-wt74
          - python-version: "3.12"
            tox_env: py312-dj60-wt74
          - python-version: "3.14"
            tox_env: py314-dj60-wt74
          - python-version: "3.12"
            tox_env: py312-dj52-wt80
          - python-version: "3.14"
            tox_env: py314-dj52-wt80
          - python-version: "3.12"
            tox_env: py312-dj60-wt80
          - python-version: "3.12"
            tox_env: py312-dj61-wt80
          - python-version: "3.14"
            tox_env: py314-dj60-wt80
          - python-version: "3.14"
            tox_env: py314-dj61-wt80
          - python-version: "3.12"
            tox_env: py312-lowest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with tox
        run: uvx --with tox-uv tox -e "$TOX_ENV"
        env:
          TOX_ENV: ${{ matrix.tox_env }}
