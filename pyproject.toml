[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
filelock = "2026-10-27T00:00:00Z"  # 4.2.4 fixes GHSA-2g95-wg33-c5x2 GHSA-567q-5qvw-pf92 GHSA-9vhv-jxww-xfm5 ...
pillow = "2026-10-27T00:00:00Z"  # 13.0.0 fixes GHSA-24rc-8hj2-v98c GHSA-462x-pgg6-55fp GHSA-4rm8-3hmm-39fg ...
uv = "2026-10-27T00:00:00Z"  # 0.13.5 fixes GHSA-hq85-5cpj-mr62
virtualenv = "2026-10-27T00:00:00Z"  # 21.14.13 fixes GHSA-394h-qwmc-48pf GHSA-43mp-35q3-x3fq GHSA-494p-63j8-28p3 ...

[tool.djlint]
format_css = false
ignore = "H031"

[tool.ruff]
line-length = 99
extend-exclude = ["**/migrations/"]
lint.select = ["E4", "E7", "E9", "F", "I"]
lint.extend-ignore = ["F405", "E731"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests/"]
django_find_project = false
addopts = ["--nomigrations"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[dependency-groups]
dev = [
    "django-recaptcha>=4.0.0",
    "pre-commit",
    "psycopg>=3.2.9",
    "pytest",
    "pytest-django",
    "ruff",
    "tox>=4.26.0",
    "tox-uv",
]
docs = [
    "karma-sphinx-theme>=0.0.8",
    # karma-sphinx-theme uses the "style" template field that Sphinx 7 removed
    "sphinx<7",
    "sphinx-autobuild",
]

[tool.setuptools.packages.find]
include = ["wagtailstreamforms*"]
exclude = ["tests*", "docs*"]


[project]
name = "wagtailstreamforms"
version = "5.3.0"
description = "Wagtail forms in a streamfield"
authors = [{ name = "Lab Digital BV", email = "info@labdigital.nl" }]
dependencies = [
    "wagtail>=7.0,<9.0",
    "Unidecode>=0.04.14,<2.0",
    "wagtail-generic-chooser>=0.8",
    "wagtail-modeladmin>=2.5.0",
]
requires-python = ">=3.12"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wagtail", "streamfield", "forms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
Homepage = "https://github.com/labd/wagtailstreamforms"
Documentation = "https://wagtailstreamforms.readthedocs.io/"
Changelog = "https://github.com/labd/wagtailstreamforms/blob/master/CHANGELOG.rst"
Issues = "https://github.com/labd/wagtailstreamforms/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
