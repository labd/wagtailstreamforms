[tool.djlint]
format_css = false
ignore = "H031"

[tool.ruff]
line-length = 99
extend-exclude = ["**/migrations/"]
lint.select = ["E4", "E7", "E9", "F", "I"]
lint.extend-ignore = ["F405", "E731"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests/"]
django_find_project = false
addopts = ["--nomigrations"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[dependency-groups]
dev = [
    "django-recaptcha>=4.0.0",
    "pre-commit",
    "psycopg>=3.2.9",
    "pytest",
    "pytest-django",
    "ruff",
    "tox>=4.26.0",
    "tox-uv",
]
docs = [
    "karma-sphinx-theme>=0.0.8",
    # karma-sphinx-theme uses the "style" template field that Sphinx 7 removed
    "sphinx<7",
    "sphinx-autobuild",
]

[tool.setuptools.packages.find]
include = ["wagtailstreamforms*"]
exclude = ["tests*", "docs*"]


[project]
name = "wagtailstreamforms"
version = "5.3.0"
description = "Wagtail forms in a streamfield"
authors = [{ name = "Lab Digital BV", email = "info@labdigital.nl" }]
dependencies = [
    "wagtail>=7.0,<9.0",
    "Unidecode>=0.04.14,<2.0",
    "wagtail-generic-chooser>=0.8",
    "wagtail-modeladmin>=2.5.0",
]
requires-python = ">=3.12"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["wagtail", "streamfield", "forms"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
Homepage = "https://github.com/labd/wagtailstreamforms"
Documentation = "https://wagtailstreamforms.readthedocs.io/"
Changelog = "https://github.com/labd/wagtailstreamforms/blob/master/CHANGELOG.rst"
Issues = "https://github.com/labd/wagtailstreamforms/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
